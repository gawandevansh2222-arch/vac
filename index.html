<html>
   <head>
        <title>Student Registration</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
   </head>
   
   <body>
        <div class="container">
          <h1 class="display-10">Student Registration Form</h1>
          <form method="post" action="http://127.0.0.1:3000/register">
               <input type="text" name="full_name" placeholder="Enter full name"
               class="form-control" required>
               <br>
               <input type="email" name="email" placeholder="Enter Email"
               class="form-control" required>
               <br>
               <select name="branch" class="form-select" required>
                    <option value="">--Select branch--</option>
                         <option value="etc">eletronics eng</option>
                         <option value="cse">computer eng</option>
                         <option value="mac">machanical eng</option>
                         <option value="EE">eletrical eng</option>
               </select>
               <br>
               <input type="number" name="mobile_no" required placeholder="Enter Mobile number" class="form-control" minilength="10" maxlength="10">
               <br>
               <input type="submit" value="Register Now!" class="btn btn-danger">

          </form>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
   </body>
</html>
